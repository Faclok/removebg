services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Database__ConnectionString: Data Source=/data/removebg.db
      Accounts__StartingBalanceKopecks: ${Accounts__StartingBalanceKopecks:-100000}
      Removal__ModelPath: /models/birefnet-general-lite.onnx
      Removal__CpuWorkers: ${Removal__CpuWorkers:-2}
      Removal__IntraOpThreads: ${Removal__IntraOpThreads:-4}
      Removal__MaxUploadBytes: ${Removal__MaxUploadBytes:-15728640}
      Removal__MaxImagePixels: ${Removal__MaxImagePixels:-40000000}
      Admin__Token: ${Admin__Token:-}
    volumes:
      - removebg-data:/data
      - removebg-models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  removebg-data:
  removebg-models:
