services:
  api:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      Database__ConnectionString: Data Source=/data/removebg.db
      Removal__ModelPath: /models/birefnet-general-lite.onnx
    volumes:
      - removebg-data:/data
      - removebg-models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  web:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  removebg-data:
  removebg-models:
