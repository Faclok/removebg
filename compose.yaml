services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/removebg.db
      U2NET_HOME: /models
    volumes:
      - removebg-data:/data
      - removebg-models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

volumes:
  removebg-data:
  removebg-models:

