services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-removebg}
      MYSQL_USER: ${MYSQL_USER:-removebg}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - removebg-mysql:/var/lib/mysql
    healthcheck:
      # mysqladmin ping only checks whether the server accepts connections.
      # Authentication is deliberately omitted so passwords with shell-special
      # characters cannot break the probe before the application is started.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Database__ConnectionString: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-removebg};User=${MYSQL_USER:-removebg};Password=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required};SslMode=Preferred;AllowPublicKeyRetrieval=True"
      Accounts__StartingBalanceKopecks: ${Accounts__StartingBalanceKopecks:-100000}
      Email__Host: ${Email__Host:-}
      Email__Port: ${Email__Port:-587}
      Email__EnableSsl: ${Email__EnableSsl:-true}
      Email__Username: ${Email__Username:-}
      Email__Password: ${Email__Password:-}
      Email__FromAddress: ${Email__FromAddress:-}
      Email__FromName: ${Email__FromName:-Удалифон}
      Email__LoginUrl: ${Email__LoginUrl:-http://localhost:8000/}
      Removal__ModelPath: /models/birefnet-general-512-fp16.onnx
      Removal__InputSize: ${Removal__InputSize:-512}
      Removal__CpuWorkers: ${Removal__CpuWorkers:-1}
      Removal__IntraOpThreads: ${Removal__IntraOpThreads:-6}
      Removal__QueueCapacity: ${Removal__QueueCapacity:-2}
      Removal__PngCompressionLevel: ${Removal__PngCompressionLevel:-1}
      Removal__MaxUploadBytes: ${Removal__MaxUploadBytes:-15728640}
      Removal__MaxImagePixels: ${Removal__MaxImagePixels:-40000000}
      Removal__MaxImageWidth: ${Removal__MaxImageWidth:-10000}
      Removal__MaxImageHeight: ${Removal__MaxImageHeight:-10000}
      Removal__MaxAttempts: ${Removal__MaxAttempts:-3}
      Removal__ProcessingTimeoutSeconds: ${Removal__ProcessingTimeoutSeconds:-300}
      Removal__RetryDelaySeconds: ${Removal__RetryDelaySeconds:-2}
      Admin__Token: ${Admin__Token:-}
    volumes:
      - removebg-models:/models
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The official 512 model is about 897 MiB and is downloaded on first boot.
      start_period: 20m
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-6}"
          memory: ${API_MEMORY_LIMIT:-20G}

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  removebg-mysql:
  removebg-models:
