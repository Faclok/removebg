services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      Database__ConnectionString: Data Source=/data/removebg.db
      Removal__ModelPath: /models/birefnet-general-lite.onnx
    volumes:
      - removebg-data:/data
      - removebg-models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

volumes:
  removebg-data:
  removebg-models:
