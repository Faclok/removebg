[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "udalifon-api"
version = "0.1.0"
description = "CPU-only API для удаления фона с рублевым балансом"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "rembg[cpu]>=2.0.67,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # Depends/File/Query in FastAPI signatures are intentional.
